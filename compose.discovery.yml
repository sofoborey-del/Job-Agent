# Outbound-only deployment. Nothing is published to a routable address: the one published port is
# bound to the host's own loopback, for an SSH forward, and the API itself still listens on the
# container's loopback only.
services:
  agent:
    ports:
      # Host loopback only. Not 0.0.0.0, so this is unreachable from the network however the host
      # firewall is configured, and Docker's own iptables rules cannot widen it. It reaches the
      # tracker-access bridge below, never the API directly.
      - '127.0.0.1:3310:3310'
    build:
      context: .
      dockerfile: Dockerfile.discovery
    env_file:
      - .env.hosted
    environment:
      AGENT_DEPLOYMENT_MODE: discovery_only
      DB_MODE: embedded
      PGLITE_DATA_DIR: /data/pglite
      ARTIFACT_DATA_DIR: /data/artifacts
      API_HOST: 127.0.0.1
      API_PORT: 3210
      DISCOVERY_SCHEDULER_ENABLED: 'true'
      FAKE_ATS_ORIGIN: http://127.0.0.1:3311
    volumes:
      - agent-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    # Logs can name job titles, and the host disk is small. Bound them so a long-running
    # container cannot fill the volume group.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3210/health').then(async r => { const h = await r.json(); if (!r.ok || !h.schedulerReady || !h.notificationsConfigured || h.browserAutomation !== false || h.autoSubmit !== false) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Relays the published loopback port to the API's loopback listener, inside the agent's own
  # network namespace. It exists because the API must not bind to a routable address and a
  # published Docker port cannot reach a loopback listener. It carries no credentials, adds no
  # authority, and is the only way the local screens can be opened over an SSH forward.
  #
  # Stopping it closes that door without touching discovery:
  #   docker compose -f compose.discovery.yml stop tracker-access
  tracker-access:
    image: job-agent-agent:latest
    depends_on:
      - agent
    network_mode: 'service:agent'
    entrypoint: ['node', '/app/scripts/tracker-access-forwarder.mjs']
    environment:
      FORWARD_LISTEN_PORT: '3310'
      FORWARD_TARGET_PORT: '3210'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: '2'

volumes:
  agent-data:
    name: job-application-agent-data
